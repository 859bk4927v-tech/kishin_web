<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-app-ja="pageMeta.reservationTitle"></title>
  <meta name="description" data-app-ja-attr="content:pageMeta.reservationDescription" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="reservation-page">
  <a class="skip-link" href="#main" data-app-ja="actions.skipToContent"></a>

  <site-header active-page="reservation"></site-header>

  <main id="main">
    <section class="hero" aria-labelledby="reservation-title">
      <div class="container">
        <p class="hero-eyebrow" data-app-ja="reservationPage.heroEyebrow"></p>
        <h1 id="reservation-title" data-app-ja="reservationPage.title"></h1>
        <p class="hero-lead" data-app-ja="reservationPage.lead"></p>
      </div>
    </section>

    <section class="section booking-section" aria-labelledby="booking-form-title">
      <div class="container booking-container">
        <section id="selectedSymptom" class="selected-symptom" aria-labelledby="selected-symptom-title" hidden>
          <h2 id="selected-symptom-title" class="section-title"></h2>
          <p id="selected-symptom-description"></p>
        </section>

        <div class="section-head">
          <p class="eyebrow" data-app-ja="reservationPage.formEyebrow"></p>
          <h2 class="section-title" id="booking-form-title" data-app-ja="reservationPage.formTitle"></h2>
        </div>

        <div id="bookingNotice" class="booking-notice" role="status" aria-live="polite" hidden></div>

        <form id="bookingForm" class="booking-form">
          <div class="form-field">
            <label for="menu"><span data-app-ja="form.menuLabel"></span> <span class="required" data-app-ja="form.required"></span></label>
            <select id="menu" name="menu" required>
              <option value="" data-app-ja="form.chooseMenu"></option>
              <option value="first"></option>
              <option value="acupuncture"></option>
              <option value="acupuncture_moxa"></option>
              <option value="meridian"></option>
            </select>
          </div>

          <fieldset class="calendar-field">
            <legend>希望日時を選択 <span class="required">必須</span></legend>
            <p id="calendarHelp" class="field-help">メニューを選び、カレンダーの「○」をタップしてください。</p>
            <p id="dateHelp" class="field-help" data-app-ja="form.dateHelp"></p>
            <div class="calendar-navigation">
              <button type="button" id="bookingPrevious" class="btn btn-outline" disabled>前の一週間</button>
              <p id="bookingWeekLabel" class="calendar-range" aria-live="polite"></p>
              <button type="button" id="bookingNext" class="btn btn-outline" disabled>次の一週間</button>
            </div>
            <p class="calendar-scroll-hint">カレンダーを左右にスクロールすると、ほかの日付を確認できます。</p>
            <p class="calendar-legend">○ 予約可能　× 受付不可　✓ 選択中</p>
            <p id="slotMessage" class="field-help" role="status" aria-live="polite"></p>
            <button type="button" id="bookingCalendarRetry" class="btn btn-outline" hidden>再読み込み</button>
            <div id="bookingCalendar" class="calendar-scroll" role="region" aria-label="予約日時カレンダー" aria-describedby="calendarHelp" tabindex="0"></div>
            <p id="selectedDateTime" class="calendar-selection" role="status" aria-live="polite">日時を選択してください。</p>
            <input id="bookingDate" name="date" type="hidden" />
            <input id="bookingTime" name="time" type="hidden" />
          </fieldset>

          <div class="form-divider" aria-hidden="true"></div>

          <div class="form-field">
            <label for="customerName"><span data-app-ja="form.nameLabel"></span> <span class="required" data-app-ja="form.required"></span></label>
            <input id="customerName" name="name" type="text" autocomplete="name" maxlength="80" required />
          </div>
          <div class="form-field">
            <label for="customerPhone"><span data-app-ja="form.phoneLabel"></span> <span class="required" data-app-ja="form.required"></span></label>
            <input id="customerPhone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" placeholder="" data-app-ja-attr="placeholder:form.phonePlaceholder" required />
          </div>
          <div class="form-field">
            <label for="customerEmail"><span data-app-ja="form.emailLabel"></span> <span class="optional" data-app-ja="form.optional"></span></label>
            <input id="customerEmail" name="email" type="email" autocomplete="email" maxlength="254" />
          </div>

          <div class="privacy-note">
            <p data-app-ja="form.privacyNotice"></p>
          </div>

          <label class="honeypot" aria-hidden="true"><span data-app-ja="form.honeypot"></span><input name="website" type="text" tabindex="-1" autocomplete="off" /></label>
          <button class="btn btn-primary btn-lg booking-submit" id="bookingSubmit" type="submit"></button>
        </form>

        <p class="booking-contact"><span data-app-ja="form.bookingContact"></span> <a href="" data-app-ja="phone" data-app-ja-attr="href:phoneLink"></a> <span data-app-ja="form.contactOr"></span> <a href="" data-app-ja="form.emailLink" data-app-ja-attr="href:email"></a><span data-app-ja="reservationPage.contactSentenceEnd"></span></p>
        <p class="booking-admin-link"><a href="../admin/admin_page.html" data-app-ja="reservationPage.adminManagementLink"></a></p>
      </div>
    </section>
  </main>

  <site-footer active-page="reservation"></site-footer>

  <script src="../../js/app_ja.js"></script>
  <script src="../../js/component/shared_component.js"></script>
  <script src="../../js/component/header_component.js"></script>
  <script src="../../js/component/footer_component.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/weekly_calendar.js"></script>
  <script src="../../js/reservation_page.js"></script>
</body>
</html>
