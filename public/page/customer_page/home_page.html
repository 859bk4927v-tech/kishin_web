    <!-- 料金 -->
    <section class="section price" id="price">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-app-ja="homePage.priceEyebrow"></p>
          <h2 class="section-title" data-app-ja="homePage.priceTitle"></h2>
        </div>
        <div class="price-table">
          <div class="price-row">
            <span class="name" data-app-ja="menus.first"></span>
            <span class="amount" data-app-ja="prices.first"></span>
          </div>
          <div class="price-row">
            <span class="name" data-app-ja="menus.acupuncture"></span>
            <span class="amount" data-app-ja="prices.acupuncture"></span>
          </div>
          <div class="price-row">
            <span class="name" data-app-ja="menus.acupunctureMoxa"></span>
            <span class="amount" data-app-ja="prices.acupunctureMoxa"></span>
          </div>
          <div class="price-row">
            <span class="name" data-app-ja="menus.meridian"></span>
            <span class="amount" data-app-ja="prices.meridian"></span>
          </div>
        </div>
        <p class="price-note" data-app-ja="homePage.priceTaxNote"></p>
        <div class="price-cta">
          <a class="btn btn-primary" href="price_page.html" data-app-ja="homePage.priceDetailsLink"></a>
        </div>
      </div>
    </section>

    <!-- 流れ -->
    <section class="section flow" id="flow">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-app-ja="homePage.flowEyebrow"></p>
          <h2 class="section-title" data-app-ja="homePage.flowTitle"></h2>
        </div>
        <div class="flow-grid">
          <div class="flow-step">
            <p class="step-no" data-app-ja="homePage.flowSteps.0.0"></p>
            <h3 data-app-ja="homePage.flowSteps.0.1"></h3>
            <p data-app-ja="homePage.flowSteps.0.2"></p>
          </div>
          <div class="flow-step">
            <p class="step-no" data-app-ja="homePage.flowSteps.1.0"></p>
            <h3 data-app-ja="homePage.flowSteps.1.1"></h3>
            <p data-app-ja="homePage.flowSteps.1.2"></p>
          </div>
          <div class="flow-step">
            <p class="step-no" data-app-ja="homePage.flowSteps.2.0"></p>
            <h3 data-app-ja="homePage.flowSteps.2.1"></h3>
            <p data-app-ja="homePage.flowSteps.2.2"></p>
          </div>
          <div class="flow-step">
            <p class="step-no" data-app-ja="homePage.flowSteps.3.0"></p>
            <h3 data-app-ja="homePage.flowSteps.3.1"></h3>
            <p data-app-ja="homePage.flowSteps.3.2"></p>
          </div>
        </div>
        <div class="flow-cta booking-invitation">
          <p class="eyebrow" data-app-ja="homePage.bookingEyebrow"></p>
          <h3 data-app-ja="homePage.bookingTitle"></h3>
          <p class="booking-invitation-copy" data-app-ja="homePage.bookingLead"></p>
          <a class="btn btn-primary btn-lg" href="reservation_page.html" data-app-ja="homePage.reserveLink"></a>
        </div>
      </div>
    </section>

    <!-- ごあいさつ -->
    <section class="section intro" id="greeting">
      <div class="container intro-grid">
        <div class="intro-text">
          <p class="eyebrow" data-app-ja="homePage.greetingEyebrow"></p>
          <h2 class="section-title"><span data-app-ja="homePage.greetingTitleLead"></span><br /><span data-app-ja="shopName"></span><span data-app-ja="homePage.greetingTitleSuffix"></span></h2>
          <p data-app-ja="homePage.greetingBody"></p>
          <p data-app-ja="homePage.greetingClosing"></p>
          <p class="intro-sign"><span data-app-ja="directorRole"></span> <span class="sign-name" data-app-ja="directorName"></span></p>
        </div>
        <aside class="intro-features" aria-labelledby="features-title">
          <p class="eyebrow" data-app-ja="homePage.featuresEyebrow"></p>
          <h3 id="features-title" data-app-ja="homePage.featuresTitle"></h3>
          <ol class="feature-list">
            <li>
              <span class="feature-number" aria-hidden="true">01</span>
              <div>
                <h4 data-app-ja="homePage.features.0.title"></h4>
                <p data-app-ja="homePage.features.0.description"></p>

            </li>
            <li>
              <span class="feature-number" aria-hidden="true">02</span>
              <div>

                <p data-app-ja="homePage.features.1.description"></p>
              </div>
            </li>
            <li>
              <span class="feature-number" aria-hidden="true">03</span>
              <div>
                <h4 data-app-ja="homePage.features.2.title"></h4>
                <p data-app-ja="homePage.features.2.description"></p>
              </div>
            </li>
          </ol>
          <a class="intro-details" href="treatment_page.html" data-app-ja="homePage.introDetailsLink"></a>
        </aside>
      </div>
    </section>

    <!-- アクセス -->

      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-app-ja="homePage.accessEyebrow"></p>

            <dt data-app-ja="contactLabels.email"></dt>

            <dt data-app-ja="contactLabels.access"></dt>
            <dd data-app-ja="homePage.parkingAvailable"></dd>
