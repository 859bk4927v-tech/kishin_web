<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-app-ja="pageMeta.priceTitle"></title>
  <meta name="description" data-app-ja-attr="content:pageMeta.priceDescription" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main" data-app-ja="actions.skipToContent"></a>

  <site-header active-page="price"></site-header>

  <main id="main">
    <section class="hero" aria-labelledby="price-title">
      <div class="container">
        <p class="hero-eyebrow" data-app-ja="pricePage.heroEyebrow"></p>
        <h1 id="price-title" data-app-ja="pricePage.title"></h1>
        <p class="hero-lead" data-app-ja="pricePage.lead"></p>
      </div>
    </section>

    <section class="section price price-page" aria-labelledby="price-list-title">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-app-ja="pricePage.menuEyebrow"></p>
          <h2 class="section-title" id="price-list-title" data-app-ja="pricePage.listTitle"></h2>
        </div>
        <div class="price-table" aria-label="" data-app-ja-attr="aria-label:pricePage.tableLabel">
          <div class="price-row">
            <span class="name" data-app-ja="menus.first"></span>
            <span class="amount" data-app-ja="prices.first"></span>
          </div>
          <div class="price-row">
            <span class="name" data-app-ja="menus.acupuncture"></span>
            <span class="amount" data-app-ja="prices.acupuncture"></span>
          </div>
          <div class="price-row">
            <span class="name" data-app-ja="menus.acupunctureMoxa"></span>
            <span class="amount" data-app-ja="prices.acupunctureMoxa"></span>
          </div>
          <div class="price-row">
            <span class="name" data-app-ja="menus.meridian"></span>
            <span class="amount" data-app-ja="prices.meridian"></span>
          </div>
        </div>
        <p class="payment-note">
          <span data-app-ja="pricePage.paymentHeading"></span>：
          <strong data-app-ja="pricePage.paymentCashOnly"></strong>
        </p>
        <p class="price-note" data-app-ja="pricePage.taxNote"></p>
        <div class="price-cta">
          <a class="btn btn-primary" href="reservation_page.html" data-app-ja="pricePage.reservationLink"></a>
          <a class="btn btn-primary" href="" data-app-ja="pricePage.contactEmailLink" data-app-ja-attr="href:email"></a>
        </div>
      </div>
    </section>
  </main>

  <site-footer active-page="price"></site-footer>

  <script src="../../js/app_ja.js"></script>
  <script src="../../js/component/shared_component.js"></script>
  <script src="../../js/component/header_component.js"></script>
  <script src="../../js/component/footer_component.js"></script>
  <script src="../../js/main.js"></script>
</body>
</html>
