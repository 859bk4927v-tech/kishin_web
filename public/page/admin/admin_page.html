<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title data-app-ja="pageMeta.adminTitle"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="admin-page">
  <a class="skip-link" href="#main" data-app-ja="actions.skipToContent"></a>
  <site-header active-page="admin"></site-header>
  <main id="main">
    <section class="hero" aria-labelledby="admin-title">
      <div class="container"><p class="hero-eyebrow">Administrator</p><h1 id="admin-title">予約管理</h1><p class="hero-lead">予約情報はログイン後に表示されます。このページのURLを知っているだけでは、予約情報を見られません。</p></div>
    </section>
    <section class="section booking-section">
      <div class="container admin-container">
        <div id="adminNotice" class="booking-notice" role="status" aria-live="polite" hidden></div>
        <form id="adminLogin" class="admin-login">
          <label for="adminToken" data-app-ja="form.adminLoginLabel"></label>
          <input id="adminToken" type="password" autocomplete="off" required />
          <button class="btn btn-primary" type="submit" data-app-ja="form.adminSubmit"></button>
          <small data-app-ja="form.adminTokenHelp"></small>
        </form>

        <div id="adminDashboard" hidden>
          <div class="admin-toolbar">
            <div class="form-field"><label for="adminDate" data-app-ja="form.adminDate"></label><input id="adminDate" type="date" /></div>
            <button class="btn btn-primary" id="adminRefresh" type="button" data-app-ja="form.refresh"></button>
            <button class="btn btn-outline" id="adminLogout" type="button" data-app-ja="form.logout"></button>
          </div>
          <div class="calendar-navigation">
            <button type="button" id="adminPrevious" class="btn btn-outline">前の一週間</button>
            <p id="adminWeekLabel" class="calendar-range" aria-live="polite"></p>
            <button type="button" id="adminNext" class="btn btn-outline">次の一週間</button>
          </div>
          <p id="adminCalendarHelp" class="field-help">予約済みの枠をタップすると、予約情報を確認できます。予約は施術終了までの時間に表示されます。</p>
          <p class="calendar-scroll-hint">カレンダーを左右にスクロールすると、ほかの日付を確認できます。</p>
            <p class="calendar-legend">予約済み：緑色の枠　空き：—　休院：休</p>
          <p id="adminCalendarStatus" role="status" aria-live="polite"></p>
          <div id="adminCalendar" class="calendar-scroll" role="region" aria-label="院長用週間予約カレンダー" aria-describedby="adminCalendarHelp" tabindex="0"></div>
          <details id="cancelledBookings" class="cancelled-bookings" hidden>
            <summary>この週のキャンセル済み予約</summary>
            <div id="cancelledBookingList" class="booking-list"></div>
          </details>
          <dialog id="bookingDialog" class="booking-dialog" aria-labelledby="booking-detail-title">
            <button type="button" id="bookingDialogClose" class="btn btn-outline dialog-close">閉じる</button>
            <div id="bookingList" class="booking-list"></div>
          </dialog>
        </div>
      </div>
    </section>
  </main>
  <site-footer active-page="admin"></site-footer>
  <script src="../../js/app_ja.js"></script>
  <script src="../../js/component/shared_component.js"></script>
  <script src="../../js/component/header_component.js"></script>
  <script src="../../js/component/footer_component.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/weekly_calendar.js"></script>
  <script src="../../js/admin_page.js"></script>
</body>
</html>
